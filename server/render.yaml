services:
  - type: web
    name: pulso-crm-whatsapp
    plan: free
    rootDir: server
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        sync: false
      - key: API_TOKEN
        sync: false
      - key: AUTH_DIR
        value: .data/auth
